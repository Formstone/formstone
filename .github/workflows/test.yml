name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Production build, including verify-scss
      - run: npm run gulp-build

      # Committed build output must match a fresh build (banner dates and license.txt aside)
      - name: Build output is up to date
        run: |
          git diff --exit-code -I '^/\*! formstone' -- dist src
          test -z "$(git ls-files --others --exclude-standard -- dist src)"

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
