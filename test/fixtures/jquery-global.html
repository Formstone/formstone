<!doctype html><html><meta charset="utf-8"><head><link rel="stylesheet" href="/src/css/modal.css"></head><body>
<a id="mt" href="#mm">modal</a><div id="mm"><p>content</p></div>
<a class="sw" href="#x1" data-swap-target="#x1">s1</a><div id="x1"></div><a class="sw" href="#x2" data-swap-target="#x2">s2</a><div id="x2"></div>
<script src="/node_modules/jquery/dist/jquery.min.js"></script>
<script type="module">
import '/src/jquery/index.js';
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const r = { errors: [] };
try {
  r.registered = { modal: typeof $.fn.modal, swap: typeof $.fn.swap, cookie: typeof $.cookie };
  $('#mt').modal(); $('.sw').swap();
  r.initReturnsJq = $('.sw').swap() instanceof jQuery;
  r.chainReturnsJq = $('.sw').swap('activate') instanceof jQuery;
  $('#mt').modal('open'); await wait(300);
  const closed = $('#mt').modal('close');
  r.closeReturns = closed instanceof Promise ? 'Promise' : (closed instanceof jQuery ? 'jQuery' : typeof closed);
  if (closed instanceof Promise) { await closed; r.promiseResolved = true; }
  $.cookie('set', 'jq', '1'); r.cookieGet = $.cookie('get', 'jq');
} catch (e) { r.errors.push(e.message); }
window.R = JSON.stringify(r);
</script></body></html>
