<!doctype html><html><meta charset="utf-8"><head><link rel="stylesheet" href="/src/css/lightbox.css"></head><body>
<a class="js-lightbox" data-lightbox-gallery="g" data-lightbox-type="url" href="/test/fixtures/assets/frame.html" title='&lt;img src=x onerror="window.__xss=1"&gt;'>one</a>
<a class="js-lightbox" data-lightbox-gallery="g" data-lightbox-type="image" href="/test/fixtures/assets/img.svg" title="Plain caption">two</a>
<pre id="out">pending</pre>
<script type="module">
import Lightbox from '/src/js/lightbox.js';
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const r = { reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches };
try {
  Lightbox.construct('.js-lightbox');
  const first = document.querySelector('.js-lightbox');
  first.click();
  await wait(800);
  const cap = document.querySelector('.fs-lightbox-caption');
  r.captionText = cap && cap.textContent;
  r.captionChildEls = cap && cap.children.length;
  r.xssRan = !!window.__xss;
  const iframe = () => document.querySelector('.fs-lightbox iframe');
  r.iframeSrcOpen = iframe() && iframe().getAttribute('src');
  first.Lightbox.next();
  await wait(800);
  r.iframeSrcAfterNext = iframe() && iframe().getAttribute('src');
  const closed = await Promise.race([first.Lightbox.close().then(() => 'resolved'), wait(2000).then(() => 'TIMEOUT')]);
  r.closePromise = closed;
  r.dialogRemoved = !document.querySelector('.fs-lightbox');
  first.click(); await wait(800);
  r.reopened = !!document.querySelector('.fs-lightbox[open]');
} catch (e) { r.error = String(e); }
document.getElementById('out').textContent = JSON.stringify(r);
</script></body></html>
