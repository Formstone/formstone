<!doctype html><html><meta charset="utf-8"><head><link rel="stylesheet" href="/src/css/index.css"></head><body>
<a id="lb" href="/test/fixtures/assets/a.svg" data-lightbox-type="image">lightbox</a>
<a id="mt" href="#mc">modal</a><div id="mc"><p>modal</p></div>
<div id="cp" data-checkpoint-animation="fade-in">checkpoint</div>
<div id="tc"><a class="t1" href="#p1" data-tabs-container="#tc">tab</a></div><div id="p1">panel</div>
<a id="sw" href="#nope" data-swap-target="#nope">swap</a>
<script type="module">
import { Lightbox, Modal, CheckPoint, Tabs, Swap } from '/src/js/index.js';
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);
const r = { errors: [], warnings: [] };
addEventListener('error', (e) => r.errors.push(e.message));
const w = console.warn; console.warn = (...a) => { r.warnings.push(String(a[0])); w(...a); };
const events = (el, names) => { const log = []; for (const n of names) { el.addEventListener(n, (e) => log.push(['el', n, e.detail && e.detail.el === el])); window.addEventListener(n, (e) => { if (e.detail && e.detail.el === el) log.push(['window', n, true]); }); } return log; };
const lbLog = events($('lb'), ['lightbox:open', 'lightbox:close']);
new Lightbox($('lb')); $('lb').Lightbox.open(); await wait(400); await $('lb').Lightbox.close();
r.lightboxEvents = lbLog;
const mLog = events($('mt'), ['modal:open', 'modal:close']);
new Modal($('mt')); $('mt').Modal.open(); await wait(400); await $('mt').Modal.close();
r.modalEvents = mLog;
let cpDetail = 'none'; $('cp').addEventListener('checkpoint:activate', (e) => { cpDetail = e.detail; });
new CheckPoint($('cp')); await wait(300);
r.checkpointDetail = cpDetail;
const t1 = document.querySelector('.t1');
new Tabs(t1);
r.tabsIdsWhileActive = [t1.id !== '', $('p1').id];
t1.Tabs.destroy();
r.tabsIdsAfterDestroy = [t1.getAttribute('id'), $('p1').getAttribute('id')];
new Swap($('sw'));
window.R = JSON.stringify(r);
</script></body></html>
