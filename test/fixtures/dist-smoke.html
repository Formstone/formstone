<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/dist/formstone.css"></head><body>
<a id="lb" href="/test/fixtures/assets/img.svg" data-lightbox-type="image">open</a>
<a id="mt" href="#mm">modal</a><div id="mm"><p>modal</p></div>
<button id="h">menu</button><nav id="nav" data-navigation-handle="#h"><a href="#x">x</a></nav>
<div><a id="t1" href="#p1" data-tabs-group="g" data-tabs-container="#tc" data-tabs-active="true">1</a></div><div id="tc"></div><div id="p1">p1</div>
<script src="/dist/formstone.js"></script>
<script>
(async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const r = { errors: [], exports: Object.keys(window.Formstone || {}).length };
  window.addEventListener('error', (e) => r.errors.push(e.message));
  try {
    const { Lightbox, Modal, Navigation, Tabs } = Formstone;
    Lightbox.construct('#lb'); Modal.construct('#mt'); Navigation.construct('#nav'); Tabs.construct('#t1');
    const sample = async (sel) => { const out = []; const t0 = performance.now(); while (performance.now() - t0 < 300) { const d = document.querySelector(sel); if (d) out.push([+getComputedStyle(d).opacity.slice(0, 4), +getComputedStyle(d, '::backdrop').opacity.slice(0, 4)]); await new Promise(requestAnimationFrame); } return out; };
    document.getElementById('lb').Lightbox.open(); const lb = await sample('dialog.fs-lightbox');
    r.lightbox = { firstFrame: lb[0], minDialog: Math.min(...lb.map((x) => x[0])), minBackdrop: Math.min(...lb.map((x) => x[1])), last: lb[lb.length - 1] };
    await document.getElementById('lb').Lightbox.close(); await wait(100);
    document.getElementById('mt').Modal.open(); const md = await sample('dialog.fs-modal');
    r.modal = { firstFrame: md[0], minDialog: Math.min(...md.map((x) => x[0])), minBackdrop: Math.min(...md.map((x) => x[1])), last: md[md.length - 1] };
  } catch (e) { r.errors.push(e.message); }
  window.R = JSON.stringify(r);
})();
</script></body></html>
