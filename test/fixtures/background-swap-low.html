<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/css/background.css"></head><body>
<a id="s1" href="#t1" data-swap-target="#t1">s1</a><div id="t1"></div>
<a id="tab1" href="#p1" data-tabs-group="g" data-tabs-container="#c" data-tabs-active="true">t</a><div id="c"></div><div id="p1">p</div>
<div id="bg" style="width:50px;height:50px"></div><div id="vid" style="width:50px;height:50px"></div>
<script type="module">
import { Swap, Tabs, Background } from '/src/js/index.js';
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const r = { errors: [] };
addEventListener('error', (e) => r.errors.push(e.message)); addEventListener('unhandledrejection', (e) => r.errors.push('unhandled: ' + (e.reason && e.reason.name)));
new Swap(document.getElementById('s1'), { minWidth: 0, maxWidth: 2000 });
r.B1_swapNumeric = { mq: document.getElementById('s1').Swap.mq, enabled: document.getElementById('s1').Swap.enabled };
new Tabs(document.getElementById('tab1'), { mobileMaxWidth: 5000 });
r.B1_tabsNumericMobile = document.getElementById('tab1').classList.contains('fs-tabs-mobile');
new Background(document.getElementById('bg'), { source: '/test/fixtures/assets/img dir/a (1).svg' });
await wait(700);
const layer = document.querySelector('#bg .fs-background-image');
r.B4_bgImage = { style: layer && layer.style.backgroundImage, loaded: layer && layer.style.opacity };
new Background(document.getElementById('vid'), { source: { mp4: '/test/fixtures/assets/none.mp4' }, mute: false, autoPlay: false });
const v = document.getElementById('vid').Background;
// Simulate the browser refusing playback (autoplay policies differ between browsers)
HTMLMediaElement.prototype.play = () => Promise.reject(new DOMException('Refused', 'NotAllowedError'));
v.play(); await wait(100);
r.B4_playRejected = { playing: v.playing };
window.R = JSON.stringify(r);
</script></body></html>
