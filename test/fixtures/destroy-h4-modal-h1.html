<!doctype html><html><meta charset="utf-8"><head><link rel="stylesheet" href="/src/css/modal.css"></head><body>
<a id="sw" href="#st" data-swap-target="#st">swap</a><div id="st">swap target</div>
<div id="tc"><a id="t1" href="#p1" data-tabs-group="g" data-tabs-container="#tc" data-tabs-active="true">Tab 1</a><a id="t2" href="#p2" data-tabs-group="g" data-tabs-container="#tc">Tab 2</a></div>
<div id="p1">panel 1</div><div id="p2">panel 2</div>
<button id="nh">menu</button><nav id="nav" data-navigation-handle="#nh" data-navigation-content="#nc">nav</nav><div id="nc">content</div>
<div id="bg" style="width:100px;height:100px"></div>
<a id="mt" href="#mm">modal</a><div id="mm">modal content</div>
<script type="module">
import { Swap, Tabs, Navigation, Background, Modal } from '/src/js/index.js';
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const errors = []; addEventListener('error', (e) => errors.push(String(e.message)));
let prevented = []; document.addEventListener('click', (e) => { if (e.defaultPrevented) prevented.push(e.target.id); });
const $ = (s) => document.querySelector(s);
const lastBg = (c) => { const l = c.lastElementChild; return l ? l.style.backgroundImage.replace(/.*\/(\w)\.svg.*/, '$1') : null; };
const r = { reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches };
let bgContainer, bgLayersAtDestroy;
window.T = {
  async setup() {
    new Swap($('#sw'), { maxWidth: '740px' });
    Tabs.construct('#t1, #t2');
    new Navigation($('#nav'));
    new Background($('#bg'), { source: { 0: '/test/fixtures/assets/a.svg', 740: '/test/fixtures/assets/b.svg' } });
    r.tabsAriaHiddenMobile = $('#t1').getAttribute('aria-hidden');
    await wait(100);
    r.bgInitial = lastBg($('.fs-background-container'));
    $('#bg').Background.load({ 0: '/test/fixtures/assets/c.svg', 740: '/test/fixtures/assets/d.svg' });
    r.bgAfterReload = lastBg($('.fs-background-container'));
    $('#sw').Swap.destroy(); $('#t1').Tabs.destroy(); $('#t2').Tabs.destroy(); $('#nav').Navigation.destroy();
    r.tabsAriaHiddenAfterDestroy = $('#t1').getAttribute('aria-hidden');
    // Modal
    Modal.construct('#mt');
    $('#mt').click(); await wait(400);
    r.modalOpened = !!document.querySelector('.fs-modal[open]');
    r.modalClose = await Promise.race([$('#mt').Modal.close().then(() => 'resolved'), wait(2000).then(() => 'TIMEOUT')]);
    r.modalRemoved = !document.querySelector('.fs-modal');
  },
  async wide() {
    await wait(300);
    bgContainer = $('.fs-background-container');
    r.bgAtWide = lastBg(bgContainer);
    $('#bg').Background.destroy();
    bgLayersAtDestroy = bgContainer.children.length;
  },
  async narrow() {
    await wait(300);
    r.bgLayersAddedAfterDestroy = bgContainer.children.length - bgLayersAtDestroy;
    for (const id of ['sw', 't1', 'nh']) $('#' + id).click();
    await wait(100);
    r.clicksBlockedAfterDestroy = prevented;
    r.tabsAriaHiddenAfterResize = $('#t1').getAttribute('aria-hidden');
    r.errors = errors;
    return JSON.stringify(r);
  }
};
window.T_READY = true;
</script></body></html>
